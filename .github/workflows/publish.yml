name: Publish to PyPI

# Publishing a GitHub release is the only trigger: pushing a tag alone publishes
# nothing, so a stray tag cannot release, and a release cannot publish twice.
on:
  release:
    types: [published]

concurrency:
  group: publish-nexusql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Release tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build twine

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Build and check
        run: |
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this repo + workflow + environment over OIDC,
    # so no API token is stored. Configure it on the project's PyPI page under
    # Publishing, with environment "pypi".
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
