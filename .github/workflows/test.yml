name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.11"]
      fail-fast: false

    # No services: block. The databases come from scripts/test_databases.py, the
    # same script a developer runs locally, so CI and a laptop get identical
    # servers (PostgreSQL 16, MySQL 8 with log_bin_trust_function_creators, and
    # SQL Server 2022 built from tests/mssql-fts.Dockerfile so full-text search is
    # present). Service containers could not do that: they cannot be built from a
    # Dockerfile or given server arguments.
    steps:
    - uses: actions/checkout@v4

    # Started first and not waited for, so the SQL Server image build and the
    # server start-ups overlap with the Python setup below. A runner without a
    # container runtime fails this step harmlessly; the probe before the
    # integration tests decides what that means (fail on GitHub-hosted, deselect
    # on self-hosted).
    - name: Start test databases
      continue-on-error: true
      run: python3 scripts/test_databases.py up --no-wait

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    # One step for everything the tests need on the host: Microsoft's ODBC driver
    # for pyodbc and pg_dump/pg_restore for the live backup tests, then the package
    # and its dev extras, then a wait until each database accepts a driver
    # connection (idempotent: the containers were started above) and the
    # TEST_*_URL exports the suite reads. Self-hosted runners have no passwordless
    # sudo: use it only when present and never prompt (-n fails fast). apt-key is
    # deprecated, so a keyring file is used.
    - name: Install dependencies and wait for databases
      timeout-minutes: 10
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        if [ "$(id -u)" -eq 0 ]; then SUDO=""
        elif sudo -n true 2>/dev/null; then SUDO="sudo -n"
        else SUDO="none"; fi

        if [ -f /opt/microsoft/msodbcsql18/lib64/libmsodbcsql-18.so ] \
           || odbcinst -q -d 2>/dev/null | grep -q 'ODBC Driver 18'; then
          echo "msodbcsql18 already present"
        elif [ "$SUDO" = "none" ]; then
          echo "::warning::No root and no passwordless sudo -- cannot install msodbcsql18; MSSQL tests will be skipped."
          echo "MSSQL_DRIVER=absent" >> "$GITHUB_ENV"
        else
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor | $SUDO tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null
          . /etc/os-release
          echo "deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${VERSION_CODENAME} main" \
            | $SUDO tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          $SUDO apt-get update -qq
          $SUDO ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 unixodbc-dev
        fi

        if command -v pg_dump >/dev/null 2>&1; then
          echo "pg_dump present"
        elif [ "$SUDO" = "none" ]; then
          echo "::warning::cannot install postgresql-client without root; pg_dump tests will skip"
        else
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends postgresql-client
        fi

        python -m pip install --upgrade pip
        pip install -e ".[dev]"

        python scripts/test_databases.py up --wait 300 || echo "::warning::some test databases are not reachable; the probe below decides"
        python scripts/test_databases.py env --plain >> "$GITHUB_ENV"

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short --cov=nexusql --cov-report=xml --cov-report=term

    - name: Run integration tests (All Databases)
      env:
        # GitHub-hosted runners really start the containers above, so a backend that
        # cannot be reached there is a broken job, not a topology quirk: the probe
        # fails the step instead of deselecting. Self-hosted runners keep the
        # lenient behaviour described below.
        NEXUSQL_CI_REQUIRE_BACKENDS: ${{ runner.environment == 'github-hosted' && '1' || '' }}
      run: |
          # A self-hosted runner may have no container runtime, or something else may
          # already listen on the test ports with other credentials. Probe each
          # backend and deselect the ones that are not ours, rather than failing a build
          # over a database that was never started.
          DESELECT=$(python scripts/ci_available_backends.py)
          [ -n "$DESELECT" ] && echo "::notice::deselecting unavailable backends: $DESELECT"
          eval pytest tests/integration/ -v --tb=short $DESELECT --cov=nexusql --cov-append --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
        pip install -e ".[dev]"

    - name: Run ruff
      run: ruff check nexusql/ tests/ || true

    - name: Run mypy
      run: mypy nexusql/ --ignore-missing-imports || true
