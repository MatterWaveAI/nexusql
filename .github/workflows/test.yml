name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.11"]
      fail-fast: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexusql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_DATABASE: nexusql_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u testuser -ptestpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: TestPass123!
          MSSQL_PID: Express
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TestPass123! -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P TestPass123! -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    # Self-hosted runners have no passwordless sudo: the old version of this step
    # called `sudo apt-key add` and blocked on a password prompt until the job hit
    # its 44-minute timeout. `apt-key` is also deprecated and gone from recent
    # Ubuntu. Skip the install if the driver is already there, use a keyring file
    # instead of apt-key, and never prompt.
    - name: Install ODBC Driver for SQL Server (for MSSQL)
      timeout-minutes: 5
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail

        if [ -f /opt/microsoft/msodbcsql18/lib64/libmsodbcsql-18.so ]            || odbcinst -q -d 2>/dev/null | grep -q 'ODBC Driver 18'; then
          echo "msodbcsql18 already present; skipping install"
          exit 0
        fi

        # No sudo on a self-hosted runner that runs as root; use it only when present
        # and non-interactive. -n makes sudo fail fast instead of prompting.
        if [ "$(id -u)" -eq 0 ]; then SUDO=""
        elif sudo -n true 2>/dev/null; then SUDO="sudo -n"
        else
          echo "::warning::No root and no passwordless sudo -- cannot install msodbcsql18."
          echo "MSSQL tests will be skipped. To run them, pre-install msodbcsql18 on this"
          echo "runner or run this job in a container with the driver baked in."
          echo "MSSQL_DRIVER=absent" >> "$GITHUB_ENV"
          exit 0
        fi

        curl -fsSL https://packages.microsoft.com/keys/microsoft.asc           | gpg --dearmor           | $SUDO tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null

        . /etc/os-release
        echo "deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${VERSION_CODENAME} main"           | $SUDO tee /etc/apt/sources.list.d/mssql-release.list > /dev/null

        $SUDO apt-get update -qq
        $SUDO ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 unixodbc-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"


    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short --cov=nexusql --cov-report=xml --cov-report=term

    # MSSQL is an optional extra (pyproject: mssql = ["pyodbc"]) and the driver cannot
    # always be installed on a self-hosted runner. Deselect those tests rather than
    # failing the build -- a missing optional driver is not a broken library.
    - name: Note skipped MSSQL tests
      if: env.MSSQL_DRIVER == 'absent'
      run: echo "::notice::msodbcsql18 unavailable on this runner; MSSQL tests deselected." 

    - name: Run integration tests (All Databases)
      env:
        TEST_POSTGRESQL_URL: "postgresql://postgres:postgres@localhost:5432/nexusql_test"
        TEST_MYSQL_URL: "mysql://testuser:testpass@localhost:3306/nexusql_test"
        TEST_MSSQL_URL: "mssql://sa:TestPass123!@localhost:1433/nexusql_test?TrustServerCertificate=yes"
      run: |
          # This job declares services: for postgres, mysql and mssql. A runner in
          # hostexecutor mode ignores them -- it runs on the host, so whatever already
          # listens on 5432/3306 answers instead, with other credentials. Probe each
          # backend and deselect the ones that are not ours, rather than failing a build
          # over a database that was never started.
          DESELECT=$(python scripts/ci_available_backends.py)
          [ -n "$DESELECT" ] && echo "::notice::deselecting unavailable backends: $DESELECT"
          eval pytest tests/integration/ -v --tb=short $DESELECT --cov=nexusql --cov-append --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
        pip install -e ".[dev]"

    - name: Run ruff
      run: ruff check nexusql/ tests/ || true

    - name: Run mypy
      run: mypy nexusql/ --ignore-missing-imports || true
