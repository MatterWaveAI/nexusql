[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusql"
version = "0.2.0"
description = "Multi-database abstraction layer with unified API for PostgreSQL, MySQL, SQLite, and MSSQL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "David", email = "david@example.com"}
]
keywords = ["database", "sql", "postgresql", "mysql", "sqlite", "mssql", "multi-database", "abstraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
# psycopg covers both the sync and async PostgreSQL paths, so there is one
# PostgreSQL dependency rather than a separate async driver.
postgresql = ["psycopg[binary,pool]>=3.1"]
mysql = ["pymysql>=1.0.0"]
mssql = ["pyodbc>=4.0.0"]
all = [
    "psycopg[binary,pool]>=3.1",
    "pymysql>=1.0.0",
    "pyodbc>=5.3.0",
]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "psycopg[binary,pool]>=3.1",
    "pymysql>=1.0.0",
    "pyodbc>=5.3.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/nexusql"
Documentation = "https://github.com/yourusername/nexusql#readme"
Repository = "https://github.com/yourusername/nexusql"
Issues = "https://github.com/yourusername/nexusql/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexusql"]
namespaces = false

[tool.setuptools.package-data]
nexusql = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short -W ignore::DeprecationWarning"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:.*sqlite3.*:",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "mysql: marks tests as MySQL-specific tests",
    "mssql: marks tests as MSSQL-specific tests",
    "postgresql: marks tests as PostgreSQL-specific tests",
    "sqlite: marks tests as SQLite-specific tests",
    "slow: marks tests as slow running tests",
]
